<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Heyzee</title>
  <meta name="description" content="A polished Yahtzee-style dice game against a witty AI. Free to play in your browser, no download." />
  <link rel="canonical" href="https://intergalacticrobots.app/heyzee/" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Heyzee" />
  <meta property="og:description" content="A polished Yahtzee-style dice game against a witty AI. Free to play, no download." />
  <meta property="og:image" content="https://intergalacticrobots.app/heyzee/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:url" content="https://intergalacticrobots.app/heyzee/" />
  <meta property="og:site_name" content="Intergalactic Robots" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Heyzee" />
  <meta name="twitter:description" content="A polished Yahtzee-style dice game against a witty AI. Free to play, no download." />
  <meta name="twitter:image" content="https://intergalacticrobots.app/heyzee/og-image.png" />

  <link rel="stylesheet" href="style.css" />
</head>
<body class="felt-green dice-classic">
  <header class="topbar">
    <div class="brand">
      <h1 class="logo">Heyzee</h1>
      <span class="best" id="bestScore" title="Your best grand total">Your personal best: —</span>
    </div>
    <div class="toggles">
      <button id="statsToggle" class="chip" title="Statistics">📊 Stats</button>
      <button id="diffToggle" class="chip" title="Opponent difficulty">AI: Medium</button>
      <button id="feltToggle" class="chip" title="Table color">Green felt</button>
      <button id="diceToggle" class="chip" title="Dice style">Classic dice</button>
      <button id="muteToggle" class="chip" title="Sound">🔊</button>
    </div>
  </header>

  <main class="table">
    <section class="play">
      <div class="players">
        <div class="player" id="player-you"><input class="pname-input" id="youName" maxlength="14" spellcheck="false" aria-label="Your name" /><span class="ptotal" id="total-0">0</span></div>
        <div class="player" id="player-ai"><span class="pname" id="aiNameLabel">AI</span><span class="ptotal" id="total-1">0</span></div>
      </div>

      <div class="dice-tray" id="diceTray"></div>

      <div class="controls">
        <button id="rollBtn" class="roll-btn">Roll</button>
        <span class="rolls" id="rollsLeft">Rolls left: 3</span>
      </div>

      <p class="status" id="status">Your turn — roll the dice.</p>
      <p class="lastmove" id="lastMove" aria-live="polite"></p>
    </section>

    <section class="card-wrap">
      <table class="scorecard" id="scorecard"></table>
    </section>
  </main>

  <footer class="site-foot">
    Another game by <a href="https://intergalacticrobots.app" target="_blank" rel="noopener">Intergalactic Robots</a>
  </footer>

  <div class="overlay hidden" id="statsOverlay">
    <div class="modal statsmodal">
      <h2>Statistics</h2>
      <div class="stats-grid" id="statsGrid"></div>
      <button id="statsClose" class="roll-btn">Close</button>
    </div>
  </div>

  <canvas id="fireworks" aria-hidden="true"></canvas>

  <div class="overlay hidden" id="overlay">
    <div class="modal">
      <h2 id="overlayTitle">Game Over</h2>
      <div id="overlayBody"></div>
      <button id="newGameBtn" class="roll-btn">New Game</button>
    </div>
  </div>

  <script src="ai.js"></script>
  <script src="game.js"></script>
</body>
</html>
